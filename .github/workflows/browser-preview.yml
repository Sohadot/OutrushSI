name: Browser preview and responsive smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser testing
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check desktop, tablet, and mobile presentation
        run: python tests/browser_smoke.py
      - name: Upload visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outrush-browser-previews
          path: artifacts/browser-preview/
          if-no-files-found: warn
          retention-days: 14
